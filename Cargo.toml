[package]
name = "somno"
version = "0.1.0"
edition = "2021"
description = "Read-only local CLI for Oura and Eight Sleep sleep data (no background process)"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
anyhow = "1"
thiserror = "2"
directories = "6"
rpassword = "7"

[dev-dependencies]
proptest = "1"
url = "2"

[profile.release]
lto = true
strip = true
